<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout Tracker</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            min-height: 100vh;
            margin: auto;
            background: white;
            padding-bottom: 50px;
        }

        /* HEADER */
        .header {
            background: #212529;
            color: white;
            padding: 25px 20px;
            border-radius: 0 0 25px 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #adb5bd;
            font-size: 14px;
        }

        /* PROGRESS */
        .progress-area {
            padding: 20px 15px;
        }

        .progress {
            height: 11px;
            border-radius: 20px;
        }

        .progress-bar {
            transition: width 0.4s ease;
        }

        /* CARD */
        .workout-card {
            margin: 0 15px 15px;
            padding: 17px;
            border: 2px solid #e9ecef;
            border-radius: 18px;
            background: white;
            transition: 0.25s;
        }

        .workout-card.completed {
            background: #e8f8ee;
            border-color: #198754;
        }

        /* DAY NUMBER */
        .day-number {
            width: 44px;
            height: 44px;
            min-width: 44px;

            border-radius: 12px;
            background: #212529;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
            font-size: 17px;

            transition: 0.25s;
        }

        .completed .day-number {
            background: #198754;
        }

        .title {
            font-weight: bold;
            font-size: 17px;
        }

        /* CHECK BUTTON */
        .check {
            width: 32px;
            height: 32px;
            min-width: 32px;

            border: 2px solid #adb5bd;
            border-radius: 50%;

            display: flex;
            justify-content: center;
            align-items: center;

            cursor: pointer;
            font-weight: bold;
            font-size: 18px;

            transition: 0.2s;
            user-select: none;
        }

        .completed .check {
            background: #198754;
            border-color: #198754;
            color: white;
        }

        /* REPS */
        .reps-area {
            margin-top: 15px;
            padding-top: 13px;

            border-top: 1px solid #eee;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reps-label {
            font-size: 14px;
            font-weight: 600;
        }

        .rep-input {
            width: 90px;
            height: 42px;

            text-align: center;

            font-size: 18px;
            font-weight: bold;

            border: 2px solid #dee2e6;
            border-radius: 10px;

            outline: none;
        }

        .rep-input:focus {
            border-color: #198754;
        }

        .saved-text {
            height: 15px;
            margin-top: 3px;

            text-align: center;
            font-size: 11px;
            color: #198754;
        }

        /* RESET */
        .reset-btn {
            height: 46px;
            border-radius: 12px;
            font-weight: 600;
        }

        @media (max-width: 400px) {

            .header h1 {
                font-size: 21px;
            }

            .workout-card {
                margin-left: 10px;
                margin-right: 10px;
            }

            .title {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <h1>💪 Workout Tracker</h1>

        <p>
            Progressive Overload Tracker
        </p>

    </div>


    <!-- PROGRESS -->

    <div class="progress-area">

        <div class="d-flex justify-content-between mb-2">

            <strong>Progress</strong>

            <span id="progressText">
                0 / 4
            </span>

        </div>


        <div class="progress">

            <div
                id="progressBar"
                class="progress-bar bg-success"
                style="width: 0%">
            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- DAY 1 - CHEST -->
    <!-- ============================= -->

    <div
        class="workout-card"
        data-day="day1"
    >

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">
                1
            </div>


            <div class="flex-grow-1">

                <div class="title">
                    Chest / Push-up
                </div>

            </div>


            <div
                class="check"
                onclick="toggleComplete('day1')">
            </div>

        </div>


        <div class="reps-area">

            <div class="reps-label">
                Reps
            </div>


            <div>

                <input
                    type="number"
                    min="0"
                    id="reps-day1"
                    class="rep-input"
                    oninput="saveReps('day1')"
                >


                <div
                    class="saved-text"
                    id="saved-day1">
                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- DAY 2 - ARMS -->
    <!-- ============================= -->

    <div
        class="workout-card"
        data-day="day2"
    >

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">
                2
            </div>


            <div class="flex-grow-1">

                <div class="title">
                    Biceps + Triceps
                </div>

            </div>


            <div
                class="check"
                onclick="toggleComplete('day2')">
            </div>

        </div>


        <div class="reps-area">

            <div class="reps-label">
                Reps
            </div>


            <div>

                <input
                    type="number"
                    min="0"
                    id="reps-day2"
                    class="rep-input"
                    oninput="saveReps('day2')"
                >


                <div
                    class="saved-text"
                    id="saved-day2">
                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- DAY 3 - SHOULDER + BACK -->
    <!-- ============================= -->

    <div
        class="workout-card"
        data-day="day3"
    >

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">
                3
            </div>


            <div class="flex-grow-1">

                <div class="title">
                    Shoulders + Back
                </div>

            </div>


            <div
                class="check"
                onclick="toggleComplete('day3')">
            </div>

        </div>


        <div class="reps-area">

            <div class="reps-label">
                Reps
            </div>


            <div>

                <input
                    type="number"
                    min="0"
                    id="reps-day3"
                    class="rep-input"
                    oninput="saveReps('day3')"
                >


                <div
                    class="saved-text"
                    id="saved-day3">
                </div>

            </div>

        </div>

    </div>


    <!-- ============================= -->
    <!-- DAY 4 - LEGS -->
    <!-- ============================= -->

    <div
        class="workout-card"
        data-day="day4"
    >

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">
                4
            </div>


            <div class="flex-grow-1">

                <div class="title">
                    Legs
                </div>

            </div>


            <div
                class="check"
                onclick="toggleComplete('day4')">
            </div>

        </div>


        <div class="reps-area">

            <div class="reps-label">
                Reps
            </div>


            <div>

                <input
                    type="number"
                    min="0"
                    id="reps-day4"
                    class="rep-input"
                    oninput="saveReps('day4')"
                >


                <div
                    class="saved-text"
                    id="saved-day4">
                </div>

            </div>

        </div>

    </div>


    <!-- RESET -->

    <div class="px-3 mt-4">

        <button
            class="btn btn-outline-danger w-100 reset-btn"
            onclick="resetProgress()"
        >
            Reset Progress
        </button>

    </div>

</div>


<script>

    /* ============================
       WORKOUT DAYS
    ============================ */

    const days = [
        "day1",
        "day2",
        "day3",
        "day4"
    ];


    /* ============================
       LOAD LOCAL STORAGE
    ============================ */

    let workoutData =
        JSON.parse(
            localStorage.getItem("myWorkoutDataV2")
        ) || {};


    /* ============================
       DEFAULT DATA
    ============================ */

    days.forEach(day => {

        if (!workoutData[day]) {

            workoutData[day] = {
                reps: 0,
                completed: false
            };

        }

    });


    /* ============================
       SAVE DATA
    ============================ */

    function saveData() {

        localStorage.setItem(
            "myWorkoutDataV2",
            JSON.stringify(workoutData)
        );

    }


    /* ============================
       SAVE REPS
    ============================ */

    function saveReps(day) {

        const input =
            document.getElementById(
                "reps-" + day
            );


        let value =
            parseInt(input.value);


        if (isNaN(value)) {
            value = 0;
        }


        workoutData[day].reps =
            value;


        saveData();


        /* SAVED MESSAGE */

        const saved =
            document.getElementById(
                "saved-" + day
            );


        saved.innerText =
            "Saved ✓";


        clearTimeout(
            saved.timer
        );


        saved.timer =
            setTimeout(() => {

                saved.innerText = "";

            }, 1000);

    }


    /* ============================
       CHECK / UNCHECK
    ============================ */

    function toggleComplete(day) {

        workoutData[day].completed =
            !workoutData[day].completed;


        saveData();

        updateUI();

    }


    /* ============================
       UPDATE UI
    ============================ */

    function updateUI() {

        let completedCount = 0;


        days.forEach(day => {

            const card =
                document.querySelector(
                    `[data-day="${day}"]`
                );


            const check =
                card.querySelector(
                    ".check"
                );


            const input =
                document.getElementById(
                    "reps-" + day
                );


            /* LOAD SAVED REPS */

            input.value =
                workoutData[day].reps;


            /* COMPLETED */

            if (
                workoutData[day].completed
            ) {

                card.classList.add(
                    "completed"
                );


                check.innerHTML =
                    "✓";


                completedCount++;

            }

            else {

                card.classList.remove(
                    "completed"
                );


                check.innerHTML =
                    "";

            }

        });


        /* PROGRESS TEXT */

        document.getElementById(
            "progressText"
        ).innerText =
            completedCount +
            " / " +
            days.length;


        /* PROGRESS BAR */

        const percentage =
            (
                completedCount /
                days.length
            ) * 100;


        document.getElementById(
            "progressBar"
        ).style.width =
            percentage + "%";

    }


    /* ============================
       RESET PROGRESS

       REPS WILL NOT RESET
    ============================ */

    function resetProgress() {

        const ask =
            confirm(
                "Workout progress reset karna hai? Saved reps delete nahi honge."
            );


        if (!ask) {
            return;
        }


        /* ONLY RESET TICKS */

        days.forEach(day => {

            workoutData[day].completed =
                false;

        });


        saveData();

        updateUI();

    }


    /* ============================
       START
    ============================ */

    updateUI();

</script>

</body>
</html>
