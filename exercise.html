<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Workout Tracker</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f4f6f8;
            font-family: Arial, sans-serif;
        }

        .app {
            max-width: 600px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
            padding-bottom: 50px;
        }

        .header {
            background: #212529;
            color: white;
            padding: 25px 20px;
            border-radius: 0 0 25px 25px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: bold;
            margin: 0;
        }

        .header p {
            margin: 5px 0 0;
            color: #adb5bd;
            font-size: 14px;
        }

        .progress-area {
            padding: 20px 15px;
        }

        .progress {
            height: 11px;
            border-radius: 20px;
        }

        .workout-card {
            margin: 0 15px 15px;
            padding: 17px;
            border: 2px solid #e9ecef;
            border-radius: 18px;
            transition: 0.25s;
        }

        .workout-card.completed {
            background: #e8f8ee;
            border-color: #198754;
        }

        .day-number {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 12px;
            background: #212529;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-weight: bold;
            font-size: 17px;
        }

        .completed .day-number {
            background: #198754;
        }

        .title {
            font-weight: bold;
            font-size: 17px;
        }

        .check {
            width: 31px;
            height: 31px;
            min-width: 31px;

            border: 2px solid #adb5bd;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
        }

        .completed .check {
            background: #198754;
            border-color: #198754;
            color: white;
        }

        .sets-area {
            margin-top: 15px;
            padding-top: 13px;
            border-top: 1px solid #eee;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sets-label {
            font-size: 14px;
            font-weight: 600;
        }

        .rep-input {
            width: 85px;
            height: 42px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            border: 2px solid #dee2e6;
            outline: none;
        }

        .rep-input:focus {
            border-color: #198754;
        }

        .saved-text {
            font-size: 11px;
            color: #198754;
            text-align: right;
            margin-top: 4px;
            height: 14px;
        }

        .reset-btn {
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>💪 Workout Tracker</h1>
        <p>Progressive Overload Tracker</p>
    </div>


    <div class="progress-area">

        <div class="d-flex justify-content-between mb-2">
            <strong>Progress</strong>
            <span id="progressText">0 / 5</span>
        </div>

        <div class="progress">
            <div
                id="progressBar"
                class="progress-bar bg-success"
                style="width: 0%">
            </div>
        </div>

    </div>


    <!-- DAY 1 -->

    <div class="workout-card" data-day="day1">

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">1</div>

            <div class="flex-grow-1">
                <div class="title">Chest / Push-up</div>
            </div>

            <div
                class="check"
                onclick="toggleComplete('day1')">
            </div>

        </div>


        <div class="sets-area">

            <div class="sets-label">
                Reps
            </div>

            <div>
                <input
                    type="number"
                    min="0"
                    id="reps-day1"
                    class="rep-input"
                    onchange="saveReps('day1')"
                    oninput="saveReps('day1')"
                >

                <div
                    class="saved-text"
                    id="saved-day1">
                </div>
            </div>

        </div>

    </div>


    <!-- DAY 2 -->

    <div class="workout-card" data-day="day2">

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">2</div>

            <div class="flex-grow-1">
                <div class="title">Abs / Core</div>
            </div>

            <div
                class="check"
                onclick="toggleComplete('day2')">
            </div>

        </div>


        <div class="sets-area">

            <div class="sets-label">
                Reps
            </div>

            <div>
                <input
                    type="number"
                    min="0"
                    id="reps-day2"
                    class="rep-input"
                    oninput="saveReps('day2')"
                >

                <div
                    class="saved-text"
                    id="saved-day2">
                </div>
            </div>

        </div>

    </div>


    <!-- DAY 3 -->

    <div class="workout-card" data-day="day3">

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">3</div>

            <div class="flex-grow-1">
                <div class="title">Biceps + Triceps</div>
            </div>

            <div
                class="check"
                onclick="toggleComplete('day3')">
            </div>

        </div>


        <div class="sets-area">

            <div class="sets-label">
                Reps
            </div>

            <div>
                <input
                    type="number"
                    min="0"
                    id="reps-day3"
                    class="rep-input"
                    oninput="saveReps('day3')"
                >

                <div
                    class="saved-text"
                    id="saved-day3">
                </div>
            </div>

        </div>

    </div>


    <!-- DAY 4 -->

    <div class="workout-card" data-day="day4">

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">4</div>

            <div class="flex-grow-1">
                <div class="title">Shoulders + Back</div>
            </div>

            <div
                class="check"
                onclick="toggleComplete('day4')">
            </div>

        </div>


        <div class="sets-area">

            <div class="sets-label">
                Reps
            </div>

            <div>
                <input
                    type="number"
                    min="0"
                    id="reps-day4"
                    class="rep-input"
                    oninput="saveReps('day4')"
                >

                <div
                    class="saved-text"
                    id="saved-day4">
                </div>
            </div>

        </div>

    </div>


    <!-- DAY 5 -->

    <div class="workout-card" data-day="day5">

        <div class="d-flex align-items-center gap-3">

            <div class="day-number">5</div>

            <div class="flex-grow-1">
                <div class="title">Legs</div>
            </div>

            <div
                class="check"
                onclick="toggleComplete('day5')">
            </div>

        </div>


        <div class="sets-area">

            <div class="sets-label">
                Reps
            </div>

            <div>
                <input
                    type="number"
                    min="0"
                    id="reps-day5"
                    class="rep-input"
                    oninput="saveReps('day5')"
                >

                <div
                    class="saved-text"
                    id="saved-day5">
                </div>
            </div>

        </div>

    </div>


    <div class="px-3 mt-4">

        <button
            class="btn btn-outline-danger w-100 reset-btn"
            onclick="resetProgress()">

            Reset All

        </button>

    </div>

</div>


<script>

const days = [
    "day1",
    "day2",
    "day3",
    "day4",
    "day5"
];


/* ==============================
   LOAD SAVED DATA
================================ */

let workoutData =
    JSON.parse(
        localStorage.getItem("myWorkoutData")
    ) || {};


/* ==============================
   CREATE DEFAULT DATA
================================ */

days.forEach(day => {

    if (!workoutData[day]) {

        workoutData[day] = {
            reps: 0,
            completed: false
        };

    }

});


/* ==============================
   SAVE ALL DATA
================================ */

function saveData() {

    localStorage.setItem(
        "myWorkoutData",
        JSON.stringify(workoutData)
    );

}


/* ==============================
   SAVE REPS
================================ */

function saveReps(day) {

    const input =
        document.getElementById(
            "reps-" + day
        );

    let value =
        parseInt(input.value);


    if (isNaN(value)) {
        value = 0;
    }


    workoutData[day].reps = value;

    saveData();


    const saved =
        document.getElementById(
            "saved-" + day
        );


    saved.innerText = "Saved ✓";


    clearTimeout(
        saved.hideTimer
    );


    saved.hideTimer =
        setTimeout(() => {

            saved.innerText = "";

        }, 1000);

}


/* ==============================
   COMPLETE / UNCOMPLETE
================================ */

function toggleComplete(day) {

    workoutData[day].completed =
        !workoutData[day].completed;

    saveData();

    updateUI();

}


/* ==============================
   UPDATE SCREEN
================================ */

function updateUI() {

    let completed = 0;


    days.forEach(day => {

        const card =
            document.querySelector(
                `[data-day="${day}"]`
            );

        const check =
            card.querySelector(".check");

        const input =
            document.getElementById(
                "reps-" + day
            );


        input.value =
            workoutData[day].reps;


        if (workoutData[day].completed) {

            card.classList.add(
                "completed"
            );

            check.innerHTML = "✓";

            completed++;

        }

        else {

            card.classList.remove(
                "completed"
            );

            check.innerHTML = "";

        }

    });


    document.getElementById(
        "progressText"
    ).innerText =
        completed + " / " + days.length;


    const percent =
        (completed / days.length) * 100;


    document.getElementById(
        "progressBar"
    ).style.width =
        percent + "%";

}


/* ==============================
   RESET
================================ */

function resetProgress() {

    const ask =
        confirm(
            "Saara workout data reset karna hai?"
        );


    if (!ask) {
        return;
    }


    localStorage.removeItem(
        "myWorkoutData"
    );


    workoutData = {};


    days.forEach(day => {

        workoutData[day] = {
            reps: 0,
            completed: false
        };

    });


    saveData();

    updateUI();

}


/* ==============================
   START
================================ */

updateUI();

</script>

</body>
</html>
